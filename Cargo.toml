[package]
name = "short-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = "0.3"
cdb64 = "0.2"
